name: persian_universe
description: "페르시아어유니버스 — 한국 화자 페르시아어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^10.0.0
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.4.0

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.16
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

  # Launcher icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/audio_manifest.json
    - assets/data/version.json
    - assets/data/dialogues/
    - assets/data/freq/
    - assets/data/grammar/
    - assets/data/vocab/
    - assets/images/ipa/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#239F40"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
